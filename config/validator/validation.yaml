App\Entity\Location:
    properties:
        city:
            - NotBlank: { groups: [create, edit] }
            - Length: { min: 2, max: 255, groups: [create, edit] }
        country:
            - NotBlank: { groups: [create, edit] }
        latitude:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: -90, max: 90, groups: [create, edit] }
        longitude:
            - NotBlank: { groups: [create] }
            - Range: { min: -180, max: 180, groups: [create, edit] }

App\Entity\Measurement:
    properties:
        date:
            - NotBlank: { groups: [create, edit] }
        celsius:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: -50, max: 50, groups: [create, edit] }
        pressure:
            - NotBlank: { groups: [create] }
            - Range: { min: 900, max: 1100, groups: [create, edit] }
        humidity:
            - NotBlank: { groups: [create] }
            - Range: { min: 0, max: 100, groups: [create, edit] }
        wind_speed:
            - NotBlank: { groups: [create] }
            - Range: { min: 0, max: 200, groups: [create, edit] }
